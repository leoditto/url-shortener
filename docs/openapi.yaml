openapi: 3.0.0
info:
  title: Go URL Shortener API
  description: A high-performance URL shortener built with Go, PostgreSQL, and Redis.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    ShortenRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        alias:
          type: string
    ShortenResponse:
      type: object
      properties:
        short_url:
          type: string
    URLStatsResponse:
      type: object
      properties:
        short_code:
          type: string
        long_url:
          type: string
        hits:
          type: integer
    MessageResponse:
      type: object
      properties:
        message:
          type: string

paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
  /login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /register:
    post:
      summary: User Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /{code}:
    get:
      summary: URL Redirect
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '301':
          description: Redirecting to long URL
  /shorten:
    post:
      summary: Shorten URL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortenRequest'
      responses:
        '200':
          description: URL shortened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortenResponse'
  /stats/{code}:
    get:
      summary: Get URL Statistics
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLStatsResponse'
  /my-urls:
    get:
      summary: List My URLs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/URLStatsResponse'
  /url/{code}:
    delete:
      summary: Delete URL
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'